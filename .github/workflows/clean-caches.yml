name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  clean-caches:
    name: Clean Caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Allow deletion of repository Actions caches
    steps:
      - name: Delete caches
        run: gh cache delete --all --succeed-on-no-caches --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
